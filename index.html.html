<style>

:root[data-theme="dark"]{--bg:#15121f;--sf:#1f1b2f;--sf2:#2a2540;--tx:#f0edfa;--mu:#9d97bb;--ac:#ff4d8d;--ac2:#6cc4ff;--ok:#4fd392;--bd:#332d4d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,system-ui,sans-serif;padding-bottom:74px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{font:800 20px Unbounded,sans-serif;letter-spacing:-.5px;cursor:pointer}.logo b{color:var(--ac)}
.sp{flex:1}
.bal{background:var(--sf2);border:0;color:var(--tx);font:800 14px Manrope,sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:14px}
nav{position:fixed;left:0;right:0;bottom:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}

h1,h2{font-family:Unbounded,sans-serif;margin:0 0 12px;letter-spacing:-.5px}h1{font-size:22px}h2{font-size:17px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;font:inherit;margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:800 14px Manrope,sans-serif;cursor:pointer}
.btn.alt{background:var(--sf2);color:var(--tx)}.btn.blue{background:var(--ac2);color:#08121c}
.btn.full{width:100%}.btn:disabled{opacity:.38;cursor:not-allowed;filter:saturate(.35)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;background:var(--sf2);color:var(--tx);border:0;border-radius:999px;padding:7px 13px;font:600 13px Manrope,sans-serif;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.cov{height:84px;display:flex;align-items:flex-end;padding:10px;font:800 22px Unbounded,sans-serif;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 45%),hsl(calc(var(--h) + 50) 70% 30%))}
.item .in{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font:800 18px Unbounded,sans-serif}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;background:var(--sf2);border-radius:6px;padding:2px 8px;font-size:12px;margin:0 4px 4px 0}
.star{color:#f5a524}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 17px Unbounded,sans-serif;color:#fff;background:hsl(var(--h) 60% 45%);flex:none}
.msgs{display:flex;flex-direction:column;gap:6px;height:48vh;overflow-y:auto;padding:4px 2px 10px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--sf2);align-self:flex-start;word-break:break-word}
.m.me{background:var(--ac2);color:#08121c;align-self:flex-end}.m.sys{align-self:center;background:none;color:var(--mu);font-size:12px;text-align:center}
.m small{display:block;opacity:.6;font-size:11px;margin-top:2px}
.dlg{display:flex;gap:12px;align-items:center;cursor:pointer}
.big{font:800 34px Unbounded,sans-serif}
.qr{width:180px;height:180px;background:#fff;padding:8px;border-radius:10px;margin:8px auto;display:block}
.tx-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}
.plus{color:var(--ok);font-weight:800}.minus{color:var(--ac);font-weight:800}
.pic{width:100%;height:84px;object-fit:cover;display:block}.gal{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px}.gal img{height:160px;border-radius:10px;flex:none}.ph{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.pc{width:100px}.pc img,.pc .nb{width:100px;height:100px;object-fit:cover;border-radius:10px;display:block;background:var(--sf2)}.pc .tag{margin-top:4px}
[hidden]{display:none!important}header{flex-wrap:wrap;row-gap:6px}body.adm header,body.adm nav{display:none}body.adm{padding-bottom:20px}
.bn{position:relative;border-radius:14px;padding:16px 16px 28px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,hsl(var(--h) 70% 32%),hsl(calc(var(--h) + 40) 65% 22%));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:nowrap;height:148px;min-height:148px;max-height:148px;overflow:hidden}.bn .bt{flex:1;min-width:0;max-width:calc(100% - 130px);overflow:hidden}.bn b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:800 17px Unbounded,sans-serif;margin:6px 0 2px}.bn .bt>div:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bn .tag{background:rgba(255,255,255,.25)}.bn a.btn{text-decoration:none;display:inline-block}.dots{position:absolute;left:14px;bottom:9px;display:flex;gap:6px}.dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer}.dot.on{background:#fff}
.art{display:block;width:100%;height:auto;aspect-ratio:320/170;background:#222}
.sm .bn{height:124px;min-height:124px;max-height:124px;padding:14px 16px;margin-bottom:0}.sm .bn b{font-size:15px;margin:4px 0 0}.bnrow{grid-column:1/-1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}

const SD=seed();
function save(){try{localStorage.setItem("ggakk1",JSON.stringify({deals:S.deals,ads:S.ads,earn:S.earn,kyc:S.kyc,wd:S.wd,user:S.user,strk:S.strk,refs:S.refs,refEarn:S.refEarn,bal:S.bal,txs:S.txs,orders:S.orders,chats:S.chats,my:S.my,reviews:S.reviews,sales:S.sales}))}catch(e){}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem("ggakk1")||"null")}catch(e){}
 if(d)Object.assign(S,d);
 if(!S.reviews)S.reviews=SD.reviews;
 if(!S.sales)S.sales=SD.sales;
 if(!d||d.earn==null)S.earn=Math.round(S.sales.reduce((a,s)=>a+s.p*.95,0));if(!S.wd)S.wd=[];
 if(!d){S.my=[{id:100,game:"Valorant",title:"Мой аккаунт: Ascendant 1, 31 скин",price:2900,seller:"me",desc:"Регион EU, смена почты и пароля после оплаты.",tags:["Ascendant","EU"]}];
  S.chats={"d1":{lid:100,with:"Alex_K",msgs:[{w:"Alex_K",t:"Привет! Аккаунт ещё доступен?",time:"10:12"}]}}}}
const all=()=>[...S.my,...SD.base].filter(x=>(S.strk[x.seller]||0)<2);
const find=id=>all().find(x=>x.id==id);
const rating=u=>{const r=S.reviews[u]||[];return r.length?r.reduce((a,x)=>a+x.s,0)/r.length:0};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function go(v,p){if(v==="admin"&&!ADMIN)v="shop";S.view=v;S.p=p===undefined?null:p;S.pay=false;render();window.scrollTo(0,0)}
function pay(n,title){S.bal+=n;S.txs.unshift({n,title,d:new Date().toLocaleDateString("ru-RU")});save()}

// WebGPU используется автоматически, если доступен; иначе Transformers.js использует WASM.
const MODERATION_MODEL="Xenova/clip-vit-base-patch32";
let ggakkClassifierPromise=null;
const GGAKK_LABELS=[
  "a direct screenshot captured from a video game",
  "a screenshot of a video game menu, lobby or character inventory",
  "a screenshot of a video game player profile, rank or statistics",
  "a photograph of a computer monitor or television showing a video game",
  "a photograph of a person, selfie or portrait",
  "a photograph of a real object, product or room",
  "a photograph of an identity document, bank card or paper",
  "a meme, drawing, advertisement or unrelated picture",
  "a screenshot of a chat, messaging app or social network",
  "a photograph of a phone or computer screen showing a website"
];
async function getGGAKKClassifier(){
 if(!ggakkClassifierPromise){
  ggakkClassifierPromise=(async()=>{
   const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');
   env.allowLocalModels=false; env.useBrowserCache=true;
   return await pipeline('zero-shot-image-classification',MODERATION_MODEL,{device:'webgpu'}).catch(async()=>await pipeline('zero-shot-image-classification',MODERATION_MODEL,{device:'wasm'}));
  })().catch(e=>{ggakkClassifierPromise=null;throw e});
 }
 return ggakkClassifierPromise;
}

function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.72)};i.onerror=()=>rej();i.src=u})}
const dUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

 const p={id:++phc,st:"check"};S.ph.push(p);phr();
 try{const b=await shrink(f);p.data=await dUrl(b);phr();

function profileStats(u){let buys=0,sales=0;Object.entries(S.deals||{}).forEach(([k,d])=>{if(!d||d.cancel||!d.completedAt)return;const c=S.chats[k],it=c&&find(c.lid),seller=d.seller||(it?it.seller:null),buyer=d.buyer||(it?(it.seller==="me"?(c.with||null):"me"):null);if(buyer===u)buys++;if(seller===u)sales++});if(u==="me")(S.orders||[]).forEach(o=>{if(o.st==="released")buys++});return {buys,sales,xp:buys*100+sales*150}}
function levelInfo(xp){const limits=[0,100,300,600,1000,1600,2400,3500,5000,7000],names=["Новичок","Стажёр","Игрок","Торговец","Опытный","Эксперт","Мастер","Элитный торговец","Легенда","GGAKK Elite"];let i=0;while(i<limits.length-1&&xp>=limits[i+1])i++;const next=limits[i+1];return {level:i+1,name:names[i],from:limits[i],next:next||limits[i],progress:next?Math.max(0,Math.min(100,(xp-limits[i])/(next-limits[i])*100)):100,left:next?Math.max(0,next-xp):0}}
function vProfile(){const u=S.p||"me",me=u==="me",rv=S.reviews[u]||[],ls=all().filter(x=>x.seller===u),stats=profileStats(u),lv=levelInfo(stats.xp);

 const tabs=[["list","Объявления"],["rev","Отзывы"],["buys","Покупки"]];

 if(S.tab==="sales")b=`<div class="card">${S.sales.map(s=>`<div class="tx-row"><span>${esc(s.t)}<br><span class="mu">Покупатель ${esc(s.b)} · ${s.d}</span></span><span class="plus">+${fmt(s.p)}</span></div>`).join("")}</div>`;
 if(S.tab==="buys")b=buys();
 if(S.tab==="rev")b=rv.length?rv.map(r=>`<div class="card"><b>${esc(r.f)}</b> <span class="star">${stars(r.s)}</span><div>${esc(r.t)}</div></div>`).join(""):`<p class="mu">Отзывов пока нет.</p>`;
 return `<div class="card dlg" style="cursor:default"><div class="av" style="--h:${hue(u)};width:60px;height:60px;font-size:${me&&S.user&&S.user.av?30:24}px">${me&&S.user&&S.user.av?S.user.av:esc(nm(u)[0])}</div><div class="profile-main"><h2 style="margin:0">${esc(me?(S.user?S.user.nick:"Ваш профиль"):u)}</h2><div class="mu">На GGAKK с ${SELLERS[u]||"2025"} года</div><div><span class="star">${stars(rating(u))}</span> <b>${rating(u).toFixed(1)}</b> · отзывов: ${rv.length}</div>${!me&&S.user?`<button class="btn alt" style="margin-top:9px" data-a="rvs" data-id="${esc(u)}">✎ Оставить отзыв</button>`:""}</div></div>
 <div class="card level-panel"><div class="level-panel-title">⭐ Уровень аккаунта</div><div class="level-card"><div class="level-top"><b>Ур. ${lv.level} · ${lv.name}</b><span style="padding:3px 6px;border-radius:99px;background:linear-gradient(90deg,rgba(251,191,36,.22),rgba(232,121,249,.2));border:1px solid rgba(255,255,255,.18);color:#fde68a;font-weight:800">✧ ${stats.xp.toLocaleString("ru-RU")} XP</span></div><div class="level-track"><i style="width:${lv.progress}%"></i></div><div class="level-top"><span>${lv.next?`${stats.xp} / ${lv.next} XP`:`Максимальный уровень`}</span><span>${lv.progress}%</span></div><div class="level-hint">${lv.left?`До следующего уровня: ${lv.left.toLocaleString("ru-RU")} XP`:"Максимальный уровень достигнут"}</div><div class="level-stats"><span>🛒 Покупки: <b>${stats.buys}</b> <small>+${stats.buys*100} XP</small></span><span>💰 Продажи: <b>${stats.sales}</b> <small>+${stats.sales*150} XP</small></span></div><div class="level-info"><details><summary aria-label="Как начисляется опыт" title="Как начисляется опыт">!</summary><div class="level-info-pop">🛒 Покупка — <b>+100 XP</b><br>💰 Продажа — <b>+150 XP</b><br><span>Опыт начисляется только за завершённые сделки.</span></div></details></div></div></div>
 ${me&&S.user?ref():""}<div class="chips">${tabs.map(t=>`<button class="chip ${S.tab===t[0]?"on":""}" data-a="tab" data-id="${t[0]}">${t[1]}</button>`).join("")}</div>${b}`}

const GGSET_KEY="ggakk_ui_settings";
function ggSettings(){try{return Object.assign({theme:"original",motion:false,compact:false},JSON.parse(localStorage.getItem(GGSET_KEY)||"{}"))}catch(e){return {theme:"original",motion:false,compact:false}}}
function ggSaveSettings(v){try{localStorage.setItem(GGSET_KEY,JSON.stringify(v))}catch(e){}}
function ggApplySettings(){const v=ggSettings();document.documentElement.dataset.theme=v.theme;document.documentElement.classList.toggle("gg-reduce-motion",!!v.motion);document.documentElement.classList.toggle("gg-compact",!!v.compact);document.querySelectorAll(".theme-choice").forEach(b=>b.classList.toggle("active",b.dataset.id===v.theme));const m=document.getElementById("setting-motion"),c=document.getElementById("setting-compact");if(m)m.checked=!!v.motion;if(c)c.checked=!!v.compact}
function ggOpenSettings(open=true){const p=document.getElementById("settings-panel");if(p)p.hidden=!open;const f=document.getElementById("settings-fab");if(f)f.classList.toggle("active",open)}
function ggSetTheme(theme){const v=ggSettings();v.theme=theme;ggSaveSettings(v);ggApplySettings()}
function ggSetOption(key,value){const v=ggSettings();v[key]=value;ggSaveSettings(v);ggApplySettings()}
ggApplySettings();
